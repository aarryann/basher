<!DOCTYPE html>
<html lang="en" x-data="dashboard">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; font-src https://cdnjs.cloudflare.com; style-src 'self' 'nonce-a23gbfz9e'; script-src 'self' 'nonce-a23gbfz9e'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homation</title>
  <link nonce="a23gbfz9e" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    rel="stylesheet">
  <link href="/styles/tailwind.min.css" rel="stylesheet">
  <script defer src="/scripts/alpinejs.csp.cdn.min.js"></script>

  <style nonce="a23gbfz9e">
    /* Prevent text selection during tap and hold */
    button {
      -webkit-touch-callout: none;
      /* iOS Safari */
      -webkit-user-select: none;
      /* Safari */
      -khtml-user-select: none;
      /* Konqueror HTML */
      -moz-user-select: none;
      /* Firefox */
      -ms-user-select: none;
      /* Internet Explorer/Edge */
      user-select: none;
      /* Non-prefixed version, currently supported by Chrome and Opera */
    }

    @keyframes fade {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    .fade-out {
      animation: fade 0.8s linear forwards;
    }
  </style>
</head>

<body class="bg-black text-cyan-400">
  <!-- Search Bar -->
  <div class="w-full p-4 bg-gray-900 flex justify-center">
    <input type="text" placeholder="Search widgets..."
      class="w-full max-w-2xl p-2 rounded-lg bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
      x-model="searchQuery" />
  </div>

  <div class="grid grid-cols-3 sm:grid-cols-12 md:grid-cols-18 lg:grid-cols-24 xl:grid-cols-30 gap-4 p-5 auto-rows-min">
    <template x-for="(widget, index) in filteredWidgets" :key="index">
      <button :class="widget.widgetClass" :data-index="index"
        class="bg-gray-800 rounded-lg p-2 hover:bg-gray-600 transition relative text-left" @mousedown="startHold"
        @touchstart="startHold" @mouseup="endHold" @touchend="endHold" @mouseleave="cancelHold" @touchmove="cancelHold">
        <div class="flex items-center justify-between h-full">
          <div class="flex items-center justify-end w-6">
          </div>
          <div class="flex flex-col items-center text-md grow">
            <i :class="widget.iconClass" class="mb-1 text-lg"></i>
            <span x-text="widget.title"></span>
          </div>
          <div class="flex items-center h-full w-6">
            <span x-show="widget.countdown" x-text="widget.countdown" :class="getCountdownClass"
              class="text-5xl font-bold text-white">5</span>
          </div>
        </div>
      </button>
    </template>
  </div>

  <!-- Full-Screen Modal for Mobile -->
  <div id="modal" class="overlay" x-show="modalVisible" x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-300" x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0" x-cloak>
    <div class="bg-gray-800 rounded-lg p-5 text-white max-w-sm w-full">
      <button @click="closeModal" class="absolute top-2 right-2 text-2xl">&times;</button>
      <div id="modalContent" class="content max-h-96 overflow-y-auto" x-html="modalContent">
        <!-- Logs or feedback will be displayed here -->
      </div>
    </div>
  </div>

  <!-- Theme Toggle -->
  <div class="fixed bottom-5 right-5">
    <button @click="toggleTheme" class="bg-gray-800 text-white p-3 rounded-full">
      <i class="fas fa-adjust"></i>
    </button>
  </div>

  <script nonce="a23gbfz9e">
    document.addEventListener('alpine:init', () => {
      Alpine.data('dashboard', () => ({
        modalVisible: false,
        modalContent: '',
        theme: 'dark',
        widgets: [],
        searchQuery: '',
        expandedWidget: null,
        holdTimer: null,
        holdTriggered: false,
        touchHandled: false,
        countdownTimer: null,

        async init() {
          try {
            const response = await fetch('config.json');
            this.widgets = await response.json();
            this.initializeWidgetClasses();
          } catch (error) {
            console.error('Failed to load config.json:', error);
          }
        },

        initializeWidgetClasses() {
          this.widgets.forEach((widget, index) => {
            widget.widgetClass = this.expandedWidget === index
              ? 'col-span-6 expanded'
              : `col-span-${widget.colspan}`;
            widget.iconClass = `fas fa-${widget.icon} mb-2`;
            widget.countdown = null;
          });
        },

        get filteredWidgets() {
          if (!this.searchQuery) {
            return this.widgets;
          }
          return this.widgets.filter(widget =>
            widget.title.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
            widget.icon.toLowerCase().includes(this.searchQuery.toLowerCase())
          );
        },

        getCountdownClass() {
          const index = this.$data.index;
          //const index = this.$event.target.getAttribute('data-index');
          console.log(`getCountdownClass ${this.widgets[index].countdown}`);
          return this.widgets[index].countdown >= 0 ? 'fade-out' : '';
        },

        startHold(event) {
          const index = event.currentTarget.getAttribute('data-index');
          const isTouch = event.type.startsWith('touch');

          if (isTouch) {
            this.touchHandled = true;
          } else if (this.touchHandled) {
            // This is to avoid multiple clicks (touch and mouse) when mouseclicked in google mobile device mode. Here the mouseclick after touch is ignored
            return;
          }
          this.holdTimer = setTimeout(() => {
            this.showLogs(index);
            this.holdTriggered = true;
          }, 1000);
        },

        endHold(event) {
          const index = event.currentTarget.getAttribute('data-index');
          const isTouch = event.type.startsWith('touch');

          if (isTouch) {
            // No purpose for this code as no known problems. This is to avoid touchHandled remaning true in touch mode
            setTimeout(() => { this.touchHandled = false; }, 10);
          }
          else if (this.touchHandled) {
            // This is to avoid multiple clicks (touch and mouse) when mouseclicked in google mobile device mode. Here the mouseclick after touch is ignored
            this.touchHandled = false;
            return;
          }

          if (!this.holdTriggered) this.handleWidgetClick(index);
          clearTimeout(this.holdTimer);
          this.holdTriggered = false;
        },

        cancelHold() {
          clearTimeout(this.holdTimer);
          this.holdTriggered = false;
        },

        startCountdown(index) {
          if (this.widgets[index].countdownTimer) {
            clearTimeout(this.widgets[index].countdownTimer);
            this.widgets[index].countdownTimer = null;
            this.widgets[index].countdown = null;
            console.log('Countdown canceled for:', this.widgets[index].title);
          } else {
            this.countdown(index, 5);
          }
        },

        countdown(index, count) {
          if (count <= 0) {
            this.widgets[index].countdownTimer = null;
            this.handleOnClick(index);
            this.widgets[index].countdown = null;
            return;
          }
          this.widgets[index].countdown = count;
          console.log(`setting count ${this.widgets[index].countdown}`);
          this.widgets[index].countdownTimer = setTimeout(() => {
            this.widgets[index].countdown = null; // Reset to hide countdown before next number
            console.log(`resetting count ${this.widgets[index].countdown}`);
            setTimeout(() => { this.countdown(index, count - 1) }, 200);
          }, 800);
        },

        handleWidgetClick(index) {
          //let confirmed = confirm(`Proceed with ${this.widgets[index].title}`);
          //console.log('Widget clicked:', this.widgets[index].title);
          this.startCountdown(index);
        },

        handleOnClick(index) {
          console.log('On clicked:', this.widgets[index].title);
        },

        showLogs(index) {
          if (this.widgets[index].logs) {
            this.modalContent = this.widgets[index].logs;
            this.modalVisible = true;
          } else {
            console.log('No logs available for:', this.widgets[index].title);
          }
        },
        closeModal() {
          this.modalVisible = false;
        },
        toggleTheme() {
          if (this.theme === 'dark') {
            document.body.classList.remove('bg-black', 'text-blue-400');
            document.body.classList.add('bg-white', 'text-black');
            this.theme = 'light';
          } else {
            document.body.classList.remove('bg-white', 'text-black');
            document.body.classList.add('bg-black', 'text-blue-400');
            this.theme = 'dark';
          }
        }
      }));


    });
  </script>
</body>

</html>
