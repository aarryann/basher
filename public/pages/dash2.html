<!DOCTYPE html>
<html lang="en" x-data="dashboard()">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-black text-blue-400">
  <!-- Search Bar -->
  <div class="w-full p-4 bg-gray-900 flex justify-center">
    <input type="text" placeholder="Search widgets..."
      class="w-full max-w-2xl p-2 rounded-lg bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
      x-model="searchQuery" />
  </div>

  <div class="grid grid-cols-6 sm:grid-cols-12 md:grid-cols-18 lg:grid-cols-24 xl:grid-cols-30 gap-4 p-5 auto-rows-min">
    <template x-for="(widget, index) in filteredWidgets" :key="index">
      <button x-data="{ expanded: false, holdTimer: null, holdTriggered: false }"
        :class="expanded ? 'col-span-6 expanded' : `col-span-${widget.colspan}`"
        class="bg-gray-800 rounded-lg p-3 hover:bg-gray-600 transition relative text-left"
        @mousedown="startHold($event, widget)" @touchstart="startHold($event, widget)"
        @mouseup="endHold($event, widget)" @touchend="endHold($event, widget)" @mouseleave="cancelHold(widget)"
        @touchmove="cancelHold(widget)">
        <div class="flex flex-col items-center text-sm">
          <i :class="`fas fa-${widget.icon} mb-2`"></i>
          <span x-text="widget.title"></span>
        </div>
      </button>
    </template>
  </div>

  <!-- Full-Screen Modal for Mobile -->
  <div id="modal" class="overlay" x-show="modalVisible" x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-300" x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0" x-cloak>
    <div class="bg-gray-800 rounded-lg p-5 text-white max-w-sm w-full">
      <button @click="modalVisible = false" class="absolute top-2 right-2 text-2xl">&times;</button>
      <div id="modalContent" class="content max-h-96 overflow-y-auto" x-html="modalContent">
        <!-- Logs or feedback will be displayed here -->
      </div>
    </div>
  </div>

  <!-- Theme Toggle -->
  <div class="fixed bottom-5 right-5">
    <button @click="toggleTheme()" class="bg-gray-800 text-white p-3 rounded-full">
      <i class="fas fa-adjust"></i>
    </button>
  </div>

  <script>
    function dashboard() {
      return {
        modalVisible: false,
        modalContent: '',
        theme: 'dark',
        widgets: [],
        searchQuery: '',
        async init() {
          try {
            const response = await fetch('config.json');
            this.widgets = await response.json();
          } catch (error) {
            console.error('Failed to load config.json:', error);
          }
        },
        get filteredWidgets() {
          if (!this.searchQuery) {
            return this.widgets;
          }
          return this.widgets.filter(widget =>
            widget.title.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
            widget.icon.toLowerCase().includes(this.searchQuery.toLowerCase())
          );
        },
        startHold(event, widget) {
          this.holdTimer = setTimeout(() => {
            //this.showLogs(event.target.closest('button').__x.$data.widget);
            this.showLogs(widget);
            this.holdTriggered = true;
          }, 1000);
        },
        endHold(event, widget) {
          //if (!this.holdTriggered) this.handleWidgetClick(event.target.closest('button').__x.$data.widget);
          if (!this.holdTriggered) this.handleWidgetClick(widget);
          clearTimeout(this.holdTimer);
          this.holdTriggered = false;
        },
        cancelHold() {
          clearTimeout(this.holdTimer);
          this.holdTriggered = false;
        },
        handleWidgetClick(widget) {
          // Call your desired action here
          console.log('Widget clicked:', widget.title);
        },
        showLogs(widget) {
          // Show logs in modal if available
          if (widget.logs) {
            this.modalContent = widget.logs;
            this.modalVisible = true;
          } else {
            console.log('No logs available for:', widget.title);
          }
        },
        toggleTheme() {
          if (this.theme === 'dark') {
            document.body.classList.remove('bg-black', 'text-blue-400');
            document.body.classList.add('bg-white', 'text-black');
            this.theme = 'light';
          } else {
            document.body.classList.remove('bg-white', 'text-black');
            document.body.classList.add('bg-black', 'text-blue-400');
            this.theme = 'dark';
          }
        }
      }
    }
  </script>
</body>

</html>
